<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagramfollowers</title>
</head>
<body>
    <h1>Instagramfollowers</h1>
    <h2 id = "followersAmount"> </h2>
    <h2 id = "followingAmount"> </h2>

    <div id = "NoFollowBackDiv">
        <p>People who don't follow you back: </p>
        <li id = "NoFollowBackList">

        </li>
    </div>
    <script>

        let followersList = new Array();
        let followingList = new Array();
        let noFollowBack = new Array();

        // LOADS FOLLOWERS DATA AND PUTS INTO LIST
        function loadFollowersData(callback){
            fetch('followers.json') // Path to your JSON file
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response.json(); // Parse the JSON data
                })
                .then(followersData => {
                    // Now 'data' is a JavaScript object
                    
                    for (const user of followersData) {
                        username = user.string_list_data[0].value;
                        followersList.push(username)    ;
                    }

                    const followersAmountText = document.getElementById("followersAmount");
                    const followersAmountNum = followersList.length;
                    followersAmountText.textContent = "Followers: "
                                                        + followersAmountNum;

                    callback();
                })
                .catch(error => {
                    console.error('Error loading JSON file:', error);
                });
            }

        // LOADS FOLLOWING DATA AND PUTS INTO LIST
        function loadFollowingData(callback) {
            fetch('following.json') // Path to your JSON file
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response.json(); // Parse the JSON data
                })
                .then(followingData => {
                    // Now 'data' is a JavaScript object
                    //console.log(followingData.relationships_following[0].title); // You can work with the data here
                                
                    for (const user of followingData.relationships_following) {
                        followingList.push(user.title);
                    }

                    const followingAmountText = document.getElementById("followingAmount");
                    const followingAmountNum = followingList.length;
                    followingAmountText.textContent = "Following: " 
                                                        + followingAmountNum;

                    callback();
                })
                .catch(error => {
                    console.error('Error loading JSON file:', error);
                });
        }

        function compareData() {
            // console.log(followingList[0]);
            // console.log(followersList[0]);
            // console.log("Followers:", followersList.length);
            // console.log("Following:", followingList.length);

            for (const user of followingList) {
                if (!followersList.includes(user)) {
                    noFollowBack.push(user);
                }
            }
            const list = document.getElementById("NoFollowBackList");

            for (const user of noFollowBack){
                const item = document.createElement("li");
                item.textContent = user;
                list.appendChild(item);
            }

            // console.log(noFollowBack);
        }
        
        loadFollowersData(() => {
            loadFollowingData(compareData);
        });
        
    </script>
</body>
</html>
